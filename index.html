  <main class="wrap">
    <header><div class="top"><div><div class="k">YESTERDAY HEADLINE ARCHIVE</div><div class="title">昨日頭條報社編輯部</div></div><div><div class="bar"><span id="bar" style="width:0%"></span></div><p><b id="prog">選擇關卡</b></p></div></div></header>
    <section id="start" class="start-screen"><div class="start-panel"><h1>昨日頭條</h1><button class="start-button" onclick="showCases()">開始查證</button></div></section>
    <section id="select" class="grid event-select"><article class="card" style="grid-column:1/-1"><div class="label">YESTERDAY HEADLINE ARCHIVE</div><h2>選擇事件</h2><p style="line-height:1.8">報社資料室裡有多份未完成案件。先選擇要送上編輯桌的事件。</p></article><button class="card" onclick="startGame('dafen')" style="text-align:left"><div class="label">大分事件 / 可遊玩</div><h2>大分事件史料推理</h2><p style="line-height:1.8">拆解「歸順」這個官方用詞，查明照片、地圖、道路、口述與研究筆記之間的矛盾。</p><b>進入事件</b></button><button class="card" onclick="startGame('wushe')" style="text-align:left"><div class="label">霧社事件 / 可遊玩</div><h2>霧社事件史料推理</h2><p style="line-height:1.8">從一封破碎急電開始，先確認 1930 年 10 月 27 日霧社發生了什麼，再把原因留給後續史料慢慢查證。</p><b>進入事件</b></button></section>
    <section id="game" class="grid" style="display:none"><article class="card" id="introCard"><div class="label" id="label"></div><h2 id="title"></h2><div class="quote"><b id="npc"></b><p id="prompt"></p></div></article><article class="card e" id="editCard"><div class="edit-heading"><div><div class="k">本頁資料</div><h3 id="evTitle"></h3></div><button class="back" onclick="showIntro()">查看說明</button></div><div id="ev"></div><div id="qa"></div><div class="feed" id="feed" style="display:none"></div></article></section>

  <script>
    const S=[
      ["導入","午夜截稿前，官方稿送進報社","報社編輯","官方要求明日頭版寫成「抗日英雄歸順」。但一名布農族來訪者說，那不是投降，而是協商後的和解。你必須先查證。","桌上的任務卡",["確認 1933 年儀式與 1915 年大分事件不是同一件事。","查明道路、槍枝收繳與遷移如何影響局勢。","判斷「歸順」「和解」「達成協議」哪個用詞最能承認史料差異。"]],
      ["第一幕","打開照片背後的年份保險箱","報社資料員","這只密碼鎖要解的不是照片拍攝年份，而是「大分事件開始的年份」。不用先背日本年號，桌上的資料會給你年號起點：昭和元年是西元 1926 年，大正元年是西元 1912 年。小提示：昭和元年為西元 1926 年，昭和二年為西元 1927 年，以此類推。請先把資料上的年號換成西元，再比對便條上的「照片比事件晚了十八年」，推回真正的事件起點。","照片背後的年份保險箱",["桌上有三份可查閱資料。目標是找出事件開始年份，不是照片拍攝年份。小提示：昭和元年為西元 1926 年，昭和二年為西元 1927 年，以此類推。先用年號起點換算西元，再用便條確認照片與事件的時間差，最後把推得的四位數年份轉到密碼鎖上。"],[["A 官方照片背面",["昭和八年四月","年號換算提示：昭和元年＝西元 1926 年；昭和二年＝西元 1927 年，以此類推。","背面角落蓋有報社收件章：儀式照片，勿誤作事件起點。"]],["B 舊報紙剪報",["自大正四年事件發生以來，山區對峙與協議問題仍未平息。","年號換算提示：大正元年＝西元 1912 年。","剪報說的是事件發生年代，不是照片拍攝年代。"]],["C 編輯手寫便條",["不是同一年。","照片比事件晚了十八年。","先換算照片年份，再往前推十八年。"]]],"輸入事件開始的年份",["1915"],"密碼不對。請回到三份資料：先用昭和元年與大正元年的西元起點換算，再確認照片和事件相隔十八年。","喀噠。鐵製檔案箱打開，你取得「大分事件前史檔案／1915—1933 時間軸」。"],
      ["第二幕","地圖上的空白不是沒有人","布農族來訪者","報紙剪報寫著「大分已空」，像是故事已經結束。但路線簡圖顯示，大分社之後仍有紅色移動路線，族人曾暫時移轉到瑪斯博爾社，並在玉穗社留下後續基地。請用地圖證據修正這句過度簡化的報導。","路線圖與報紙校對欄",["左側路線簡圖顯示大分社、瑪斯博爾社、玉穗社與移動箭頭。","右側報紙句子把「原地變空」寫成「族人消失」。","請把能反駁這句話的證據卡拖進校對欄。"],"報紙說「大分已空」，這句話哪裡有問題？",["不是消失","遷移","族人遷移","轉戰","玉穗社"],"證據還不足。請挑出能證明「大分已空不等於族人消失」的卡片。","答對。地圖空白不是事件終點，而是官方只記錄原地狀態；族人仍有移動、暫時移轉與後續基地。"],
      ["第三幕","證詞裡的矛盾","口述整理員","官方紀錄寫得很平穩：「雙方和平達成協議」。可是三份訪談紀錄裡，有人提到山裡的路變近了，有人避開某個被收走的東西，有人說那張談判桌並不平。請先別急著相信紀錄的句號，聽聽證詞裡沒有直接說破的部分。","NPC 證詞與官方紀錄",["三位來訪者留下不同證詞，說法不完全一樣。","官方紀錄只留下「和平達成協議」這句結果。","請比對證詞與官方紀錄，把報導漏掉的背景補進校對欄。"],"如果報導寫「雙方和平達成協議」，還少了哪個關鍵背景？",["道路逼近","槍枝收繳","權力不對等"],"證據還不足。請從三位 NPC 證詞中找出官方紀錄漏掉的背景。","答對。協議不是單純自願；道路逼近、槍枝收繳與權力不對等，都會改變談判條件。"],
      ["第四幕","把事件放回時間裡","報社編輯","桌上的資料越堆越多，年份、路線、證詞和照片開始互相指向同一件事。現在要做的不是再找一個新答案，而是把它們放回正確順序，避免把最後一張照片誤當成整段歷史。","報社時間軸底板",["把史料卡拖到時間軸底板。","順序排對後，報導才能知道哪一幕是起點、哪一幕只是後來的場面。","注意：照片很有力，但它不是全部。"],"請把史料放回正確時間線。",["timeline"],"時間線還沒有排順。請回頭看第一幕取得的 1915—1933 線索。","答對。1933 年照片不是事件起點，而是長期衝突、轉戰、道路治理與收繳壓力之後的一個場面。"],
      ["第五幕","昨日頭條送印","總編輯","版面已經排好，只差最後校對。前面取得的線索不能只放在資料夾裡，必須變成報紙上的每一句話。請逐欄檢查：年份、地圖、證詞與照片該怎麼寫，才不會把複雜的歷史壓扁成單一說法。","最後送印編輯頁",["把前四幕取得的線索放進報紙。","每一欄都是一道送印選擇題。","答對蓋合格，答錯蓋不合格；全部合格後才能送印。"],"請完成送印前校對。",["print"],"還不能送印。請確認每一欄都蓋上合格。","送印完成。這份頭條保留了時間、移動、壓力與照片背景，沒有把單一照片當成整段歷史。"]
    ];
    const DAFEN_STAGES=S,WUSHE_STAGES=[
      ["第一幕","10月27日的急電","編輯長","霧社傳來一封破碎急電。先拼回它，只確認發生了什麼；至於為什麼會發生，還不能急著下結論。","急電資訊判讀",["拼回急電碎片。","從急電中選出能確認的資訊。","取得史料01｜10月27日霧社急電。"],"判讀急電",["telegram"],"急電還沒整理完整。","你取得史料01｜10月27日霧社急電。"],
      ["第二幕","總督說：這是一場誤解？","編輯長","報紙上有一種很明確的說法。先別急著相信它，先看清楚這段說法是從誰的立場出發。","臺灣日日新報剪報",["拿起校稿筆圈出關鍵字。","辨認主要發言者。","辨認報導如何解釋事件。"],"判讀報紙立場",["news"],"還沒有圈出關鍵位置。","你取得史料02｜當時官方觀點。"],

    const wushePrintQuestions=[
      ["headline","欄位一｜標題","這份報紙最適合使用哪一個標題？",2,["霧社暴動竟因誤解爆發","霧社英雄奮起抗日","霧社事件：不同時代如何寫下同一場衝突"]],
      ["background","欄位二｜事件背景","事件背景應該如何描述？",1,["單一偶發衝突","殖民統治、資源與生活方式改變、勞役以及近期衝突等因素共同累積","單純因為族群習俗不同"]],
      ["newspaper","欄位三｜1930年的報紙可以怎麼用？","1930 年代報紙應該被如何使用？",2,["因為是當時的報紙，所以它就是完整真相","因為有官方立場，所以完全不能使用","它是理解當時官方如何解釋事件的重要史料，但需要與其他資料互證"]],

    function wusheFinalExplanation(){return `<b>《昨日頭條》</b><br><span style="font-family:var(--font-code)">1930.10.27</span><br><br><b>霧社事件</b><br><br><b>事件脈絡｜霧社事件如何發生</b><br>霧社事件發生於 1930 年 10 月 27 日，地點在臺灣中部山區的霧社一帶，也就是今日南投仁愛鄉附近。事件中，霧社地區賽德克族馬赫坡社等部落族人，在霧社公學校運動會時攻擊在場日本人，造成多人死傷。事件發生後，日本殖民政府立即派出警察與軍隊鎮壓，霧社地區交通、通訊與秩序都受到重大影響。<br><br>這場事件不能只用「一場誤解」或「單一偶發衝突」來理解。它背後累積了殖民統治、山地治理、資源控制、勞役制度、生活方式被改變，以及族人長期承受差別待遇與壓力等因素。運動會當天的衝突是爆發點，但不是所有原因的起點。若只看當時官方報紙，很容易把事件寫成突發、意外、需要迅速鎮壓的「暴動」；這反映的是官方維持秩序與解釋責任的立場。<br><br>1930 年代的報紙仍然是重要史料，因為它能讓我們看見當時官方與殖民社會如何描述事件，例如強調秩序、鎮壓、誤解或出人意料。但它不是完整真相。後來的臺灣地方紀錄、文人書寫、中國報刊與現代研究，則提供了不同角度：有人看見震驚與同情，有人把事件放入殖民統治的壓迫脈絡，有人將它解讀為抗日與民族抵抗的一部分。<br><br>也因此，霧社事件在不同時代有不同名稱。1930 年代常被稱為「霧社暴動」，戰後某些敘事中被稱為「霧社起義」或抗日英雄事蹟；到了 2000 年後，更多討論開始強調原住民族歷史、族人記憶、創傷、紀念方式與轉型正義。事件本身沒有重新發生，但人們理解與紀念它的語言一直在改變。<br><br><b>編輯註</b><br>本報參照事件當時報刊、地方記錄、後來研究及不同群體留下的歷史敘述進行整理。不同資料形成於不同時代與位置，閱讀時應注意其來源與脈絡。<br><br><button onclick="returnHome()" style="width:100%;background:#8d2018!important;color:#f8edd0!important">回首頁，選擇下一個事件</button>`}
    function wushePrintAct(){const done=!!ok[i],qs=wushePrintQuestions;return `${photoLightbox()}<div class="print-case"><div class="newspaper-page"><div class="paper-mast"><div class="issue"><span>霧社事件專刊</span><span>送印前校樣</span></div><div class="paper-name">昨日頭條</div><div class="issue"><span>1930.10.27</span><span>編輯部查證版</span></div></div><div class="headline-box"><h4>${printAnswers.headline===2?qs[0][4][2]:"霧社事件"}</h4><p>本頁校對前四幕取得的急電、報紙、不同觀點與命名變化，避免只採用單一時代的說法。</p></div><div class="paper-columns">${qs.map(([id,title,,,opts])=>{const picked=printAnswers[id],correct=qs.find(([k])=>k===id)[3],pass=picked===correct;return `<div class="print-slot"><b>${title}</b><span>${Number.isInteger(picked)?opts[picked]:"等待編輯選句..."}</span>${Number.isInteger(picked)?`<div class="answer">${pass?"校對通過":"退回重寫"}</div><img class="stamp ${pass?'pass':'fail'}" src="assets/${pass?'stamp-pass.jpg':'stamp-fail.jpg'}" alt="${pass?'合格':'不合格'}印章">`:""}</div>`}).join("")}</div>${done?`<div class="headline-box"><h4>編輯註</h4><p>本報參照事件當時報刊、地方記錄、後來研究及不同群體留下的歷史敘述進行整理。不同資料形成於不同時代與位置，閱讀時應注意其來源與脈絡。</p></div>`:""}</div><div class="print-panel"><div class="map-tools"><div class="map-brief">逐欄選出最適合送印的句子。答錯可以重選；四欄全部合格後，才會出現最後的《昨日頭條》編輯註。</div><button class="paper-ref" onclick="zoomPhoto='assets/wushe-event-main.jpg';draw()">查看事件主圖</button></div>${qs.map(([id,title,q,correctIndex,opts])=>{const picked=printAnswers[id],order=printOptionOrder[id]||opts.map((_,n)=>n);return `<div class="print-question"><h4>${title}</h4><div>${q}</div><div class="print-options">${order.map(optIndex=>`<button class="${picked===optIndex?(picked===correctIndex?'pass':'fail'):''}" onclick="pickPrint('${id}',${optIndex})">${opts[optIndex]}</button>`).join("")}</div></div>`}).join("")}${done?`<div class="print-result">✓ 送印完成。<br><br>${wusheFinalExplanation()}</div>`:`<button onclick="check()" style="width:100%;background:#8d2018!important;color:#f8edd0!important">送印確認</button>`}</div></div>`}
    function printAct(){const done=!!ok[i];return `${photoLightbox()}<div class="print-case"><div class="newspaper-page"><div class="paper-mast"><div class="issue"><span>大分事件專刊</span><span>送印前校樣</span></div><div class="paper-name">昨日頭條</div><div class="issue"><span>編輯部查證版</span><span>史料校對中</span></div></div><div class="headline-box"><h4>大分事件不是單張照片能說完的歷史</h4><p>本報依檔案、地圖、證詞與時間軸重新校對，避免把後期儀式誤寫成事件全貌。</p></div><div class="paper-columns">${printQuestions.map(([id,title,,,opts])=>{const picked=printAnswers[id],pass=picked===0;return `<div class="print-slot"><b>${title}</b><span>${Number.isInteger(picked)?opts[picked]:"等待編輯選句..."}</span>${Number.isInteger(picked)?`<div class="answer">${pass?"校對通過":"退回重寫"}</div><img class="stamp ${pass?'pass':'fail'}" src="assets/${pass?'stamp-pass.jpg':'stamp-fail.jpg'}" alt="${pass?'合格':'不合格'}印章">`:""}</div>`}).join("")}</div></div><div class="print-panel"><div class="map-tools"><div class="map-brief">逐欄選出最適合送印的句子。答錯不會卡死，可以重選；全部蓋上合格後，報紙才會送印。</div><button class="paper-ref" onclick="zoomPhoto='assets/newspaper-reference.jpg';draw()">查看排版參考</button></div>${printQuestions.map(([id,title,q,correctIndex,opts])=>{const picked=printAnswers[id],order=printOptionOrder[id]||opts.map((_,n)=>n);return `<div class="print-question"><h4>${title}</h4><div>${q}</div><div class="print-options">${order.map(optIndex=>`<button class="${picked===optIndex?(picked===correctIndex?'pass':'fail'):''}" onclick="pickPrint('${id}',${optIndex})">${opts[optIndex]}</button>`).join("")}</div></div>`}).join("")}${done?`<div class="print-result">✓ 送印完成。<br><br><b>事件真相｜大分事件如何發生</b><br>大分事件發生在 1915 年，也就是大正四年，地點主要在今日花蓮卓溪一帶的拉庫拉庫溪流域，包含大分、喀西帕南、清水、馬西桑、阿桑來嘎等駐在所與聚落周邊。事件起因與日本殖民政府推動山區治理、道路開闢，以及南蕃槍枝收繳行動有關。槍枝對山區族群不只是武器，也牽涉狩獵、生活安全與自主權；當殖民權力深入山區並要求繳械，衝突便逐步升高。<br><br>1915 年 2 月，布農族領袖 Dahu-ali 率眾攻擊大分駐在所，揭開事件序幕。同年 5 月，衝突擴大到喀西帕南駐在所與大分駐在所；6 月，aliman-sikin 也指揮族人攻擊在馬西桑、阿桑來嘎一帶避難的日警。這些行動不是單一地點的一次事件，而是一連串沿著山區駐在所、聚落與交通路線展開的抵抗。<br><br>大分一帶後來雖然被官方記錄為「已空」，但這不代表族人消失。Dahu-ali 及族人曾暫時移轉到瑪斯博爾社，之後經由闊闊斯，翻越中央山脈雲峰與南雙頭鞍部，再往荖濃溪上游方向移動，在玉穗社建立後續抗日基地。也就是說，路線本身就是事件的一部分：離開原地不是結束，而是轉移、保存力量與延續抵抗。<br><br>此後，Dahu-ali 的抗日行動延續多年，活動範圍從拉庫拉庫溪以南到鹿野溪以北。日本方面為了加強控制，開闢關山越嶺理蕃道路，並與既有道路形成南北包夾，使玉穗社面臨更大的壓力。直到 1933 年，也就是昭和八年四月，Dahu-ali 與族人出席歸順或和解儀式。那張照片記錄的是長期衝突後的儀式場面，不是事件的開始，也不能單獨代表整段歷史。<br><br>因此，大分事件真正要被看見的，不只是「最後是否歸順」，而是族人在殖民治理、繳械、道路逼近與權力不對等之下，如何抵抗、移動、協商，並留下跨越 1915 到 1933 年的歷史記憶。<br><br><button onclick="returnHome()" style="width:100%;background:#8d2018!important;color:#f8edd0!important">回首頁，選擇下一個事件</button></div>`:`<button onclick="check()" style="width:100%;background:#8d2018!important;color:#f8edd0!important">送印確認</button>`}</div></div>`}
    function renderEvidence(s){if(currentEvent==="wushe"&&Array.isArray(s[7])&&s[7][0]==="wusheprint")return wushePrintAct();if(currentEvent==="wushe"&&Array.isArray(s[7])&&s[7][0]==="titlechange")return wusheTitleChangeAct();if(currentEvent==="wushe"&&Array.isArray(s[7])&&s[7][0]==="perspective")return wushePerspectiveAct();if(currentEvent==="wushe"&&s[0]==="第一幕")return wusheAct();if(currentEvent==="wushe"&&s[0]==="第二幕")return wusheNewsAct();if(s[0]==="第一幕")return firstAct();if(s[0]==="第二幕")return secondAct();if(s[0]==="第三幕")return thirdAct();if(s[0]==="第四幕")return timelineAct();if(s[0]==="第五幕")return printAct();return s[5].map((x,n)=>`<div class="line"><span class="num">${n+1}</span><span>${x}</span></div>`).join("")}
    function draw(){const s=stages[i],qi=qIndex(s),pct=stages.length===1?100:Math.round(i/(stages.length-1)*100);$("game").className="grid "+(editing?"edit-mode":"intro-mode");$("bar").style.width=pct+"%";$("prog").textContent=s[0]+" / "+pct+"%";$("label").textContent=s[0];$("title").textContent=s[1];$("npc").textContent=s[2];$("prompt").textContent="「"+s[3]+"」";$("evTitle").textContent=s[4];$("ev").innerHTML=renderEvidence(s);$("count").textContent=(i+1)+" / "+stages.length;$("back").disabled=i===0;$("next").disabled=i===stages.length-1&&(!s[qi]||editing);$("next").textContent=s[qi]&&!ok[i]&&editing?"先完成查證":"下一頁";$("feed").style.display=feed?"block":"none";$("feed").textContent=feed;$("qa").innerHTML=(s[0]==="第一幕"||s[0]==="第二幕"||s[0]==="第三幕"||s[0]==="第四幕"||s[0]==="第五幕")?"":(s[qi]?`<div class="q">${s[qi]}</div><div class="ans"><input id="input" placeholder="輸入整理後的答案"><button onclick="check()">查證</button></div>`:"");if($("input")){$("input").value=ans;$("input").oninput=e=>ans=e.target.value;$("input").onkeydown=e=>{if(e.key==='Enter')check()}}}
    function dragMap(e,id){e.dataTransfer.setData("text/plain",id)}
    function dropMap(e){const id=e.dataTransfer.getData("text/plain"),valid=mapLabels.some(([k])=>k===id);if(valid){if(!mapPlaced[id])mapOrder.push(id);mapPlaced[id]=true;feed="證據成立。";if(mapLabels.every(([k])=>mapPlaced[k])){ok[i]=true;feed="校對完成。你取得「線索 02｜大分已空，不等於族人消失」。"}draw()}else{feed="這張卡不能證明報導缺漏，請回到路線圖找可見證據。";draw()}}
    function dragPressure(e,id){e.dataTransfer.setData("text/plain",id)}
    function dropPressure(e){const id=e.dataTransfer.getData("text/plain"),valid=pressureLabels.some(([k])=>k===id);if(valid){if(!pressurePlaced[id])pressureOrder.push(id);pressurePlaced[id]=true;feed="證詞可支持這個背景。";if(pressureLabels.every(([k])=>pressurePlaced[k])){ok[i]=true;feed="校對完成。你取得「線索 03｜協議不是單純自願」。"}draw()}else{feed="這張卡和證詞矛盾，不能補進報導。";draw()}}
    function dragTime(e,id){e.dataTransfer.setData("text/plain",id)}
    function dropTime(e,target){const id=e.dataTransfer.getData("text/plain");if(id===target){if(!timePlaced[id])timeOrder.push(id);timePlaced[id]=true;feed="時間位置確認。";if(timeCards.every(([k])=>timePlaced[k])){ok[i]=true;feed="時間軸完成。你取得「線索 04｜照片必須放回時間線」。"}draw()}else{feed="這張史料卡不屬於這個時間位置，請再比對年份與前後關係。";draw()}}
    function printAllPass(){return activePrintQuestions().every(([k,,,correct])=>printAnswers[k]===correct)}
    function pickPrint(id,opt){printAnswers[id]=opt;const item=activePrintQuestions().find(([k])=>k===id),pass=item&&opt===item[3];feed=pass?"這一欄可以送印，蓋上合格。":"這一句會誤導讀者，先蓋退件，請重選。";if(printAllPass()){ok[i]=true;feed="送印校對完成。全部欄位都已蓋上合格。"}draw()}
    function check(){const s=stages[i],qi=qIndex(s);if(currentEvent==="wushe"&&Array.isArray(s[7])&&s[7][0]==="titlechange"){if(wusheTitleDone()){feed=s[qi+3];draw();return true}feed=wusheTitleEras.every(x=>wusheTitlePicked[x.id]===x.right)?"請回答最後的小問題。":"請先依序完成三個年代的標題判讀。";draw();return false}if(currentEvent==="wushe"&&Array.isArray(s[7])&&s[7][0]==="perspective"){if(wushePerspectiveDone()){feed=s[qi+3];draw();return true}feed=wushePerspectiveCards.every(([k])=>wushePerspectivePlaced[k])?"請回答最後的小問題。":"請先把六張句子卡拖到對應資料夾。";draw();return false}if(currentEvent==="wushe"&&s[0]==="第一幕"){if(!wusheDone()){feed="先把左側六片急電拼回完整位置。";draw();return false}if(wusheInfoPass()){ok[i]=true;feed=s[qi+3];draw();return true}feed="有些訊息不是急電能直接確認的內容。請只選日期、地點、事件輪廓、涉及雙方，以及交通通訊秩序受到影響。";draw();return false}if(currentEvent==="wushe"&&s[0]==="第二幕"){if(wusheNewsDone()){feed=s[qi+3];draw();return true}feed=wusheNewsStep===0?"請拿起鋼筆，圈出能判斷主要發言者的位置。":"請拿起鋼筆，圈出能判斷報導解釋方式的位置。";draw();return false}if(s[0]==="第一幕"){if(!lockPanelOpen){lockPanelOpen=true;feed="先點開櫃子上的密碼鎖，再轉動數字盤。";draw();return false}if(lockDigits.join("")==="1915"){ok[i]=true;feed=s[qi+3];draw();return true}feed=s[qi+2];draw();return false}if(s[0]==="第二幕"){if(mapLabels.every(([k])=>mapPlaced[k])){ok[i]=true;feed=s[qi+3];draw();return true}feed=s[qi+2];draw();return false}if(s[0]==="第三幕"){if(pressureLabels.every(([k])=>pressurePlaced[k])){ok[i]=true;feed=s[qi+3];draw();return true}feed=s[qi+2];draw();return false}if(s[0]==="第四幕"){if(timeCards.every(([k])=>timePlaced[k])){ok[i]=true;feed=s[qi+3];draw();return true}feed=s[qi+2];draw();return false}if(s[0]==="第五幕"){if(printAllPass()){ok[i]=true;feed=s[qi+3];draw();return true}feed=s[qi+2];draw();return false}if(s[qi+1].some(x=>norm(ans).includes(norm(x)))){ok[i]=true;feed=s[qi+3];ans="";draw();return true}feed=s[qi+2];draw();return false}
    $("back").onclick=()=>{i=Math.max(0,i-1);d=0;feed="";ans="";editing=false;draw()};$("next").onclick=()=>{const s=stages[i],qi=qIndex(s);if(!editing&&s[qi]){editing=true;draw();return}if(s[qi]&&!ok[i]){feed=currentEvent==="wushe"&&s[0]==="第一幕"?"先拼回急電，並完成右側資訊判讀。":s[0]==="第一幕"?"先把轉盤調成事件開始年份，再轉動把手。":"先完成查證後再前進。";editing=true;draw();return}i=Math.min(stages.length-1,i+1);d=0;feed="";ans="";editing=false;draw()};draw();
